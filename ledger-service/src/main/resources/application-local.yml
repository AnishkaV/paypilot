spring:
  datasource:
    url: jdbc:h2:file:${PAYPILOT_DATA_DIR:./data}/ledger;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
  h2:
    console:
      enabled: true    # http://localhost:8082/h2-console
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
