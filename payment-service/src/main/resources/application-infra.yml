# Production-style profile: Postgres, Kafka and Redis.
# Activate with --spring.profiles.active=infra once those are running (Docker phase).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paypilot_payments}
    username: ${DB_USER:paypilot}
    password: ${DB_PASSWORD:paypilot}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches the entities
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms        # fail fast; the idempotency guard falls back to the DB constraint
      connect-timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        linger.ms: 5
